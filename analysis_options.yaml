# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# Run `flutter analyze` to check for issues locally.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # withOpacity is deprecated in favour of withValues() but it's a Flutter
    # SDK-wide migration that we'll do incrementally — not a blocker.
    deprecated_member_use: ignore

    # These style hints are caught by the IDE; don't block CI.
    prefer_const_constructors: ignore
    curly_braces_in_flow_control_structures: ignore
    no_leading_underscores_for_local_identifiers: ignore

    # BuildContext across async gaps — acknowledged, guarded by mounted checks
    # in practice. Fine to track in the IDE but shouldn't break CI.
    use_build_context_synchronously: ignore

    # Minor style hints — visible in IDE but not CI blockers.
    use_key_in_widget_constructors: ignore
    unnecessary_brace_in_string_interps: ignore
    prefer_const_literals_to_create_immutables: ignore
    sized_box_for_whitespace: ignore

linter:
  rules:
    # Disable rules that produce noise without catching real bugs:
    avoid_print: false
