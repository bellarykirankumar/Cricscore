name: cricscore
description: CricScore - AI-assisted cricket scoring platform
publish_to: 'none'
version: 1.0.4+28

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Networking
  http: ^1.2.1

  # Auth
  flutter_secure_storage: ^9.0.0

  # Storage
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.6
  fl_chart: ^0.67.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

  # Camera & Video
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  video_player: ^2.9.1

  # WebSocket (clip triggers)
  web_socket_channel: ^3.0.1

  # (FFmpeg removed — segments uploaded individually, stitched server-side later)

  # File handling
  file_picker: ^8.0.3

  # Voice input
  speech_to_text: ^7.4.0

  # Crash reporting
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
