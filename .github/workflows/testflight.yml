name: Deploy to TestFlight

# Trigger manually from GitHub UI (Actions tab → Run workflow)
# Works from phone, browser, anywhere — no Mac needed.
on:
  workflow_dispatch:

jobs:
  testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Source ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Flutter ──────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── 3. Code signing ─────────────────────────────────────────
      - name: Import distribution certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PP_PATH"

          DECODED="$RUNNER_TEMP/decoded.plist"
          security cms -D -i "$PP_PATH" > "$DECODED"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$DECODED")
          rm "$DECODED"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      # ── 4. Export options ───────────────────────────────────────
      # uploadAndDistribute=true makes -exportArchive upload straight to
      # App Store Connect using the API key (replaces xcrun altool, which
      # Apple removed in Xcode 16).
      - name: Create ExportOptions.plist
        run: |
          cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>N9P5D4TR73</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bellark.cricscore</key>
              <string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadAndDistribute</key>
            <true/>
          </dict>
          </plist>
          PLIST

      # ── 5. App Store Connect API key ────────────────────────────
      # Written early so -exportArchive can authenticate the upload.
      - name: Set up App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          {
            echo "ASC_KEY_PATH=$KEY_PATH"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> $GITHUB_ENV

      # ── 6. Install FlutterFire CLI ──────────────────────────────
      - name: Install FlutterFire CLI
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # ── 7. Build + upload ───────────────────────────────────────
      - name: Build IPA and upload to TestFlight
        run: |
          BUILD_NUMBER=$((21 + $GITHUB_RUN_NUMBER))
          echo "Building version 1.0.4+$BUILD_NUMBER"

          # Step A: Flutter build without code signing (sets up Generated.xcconfig etc.)
          flutter build ios --release --no-codesign \
            --dart-define=ENV=prod \
            --build-number=$BUILD_NUMBER

          # Step B: Inject signing settings directly into Runner's Release config block
          # in project.pbxproj (block ID: 97C147071CF9000F007C117D). This targets only
          # the Runner target — Pods has a separate Pods.xcodeproj and is unaffected.
          # Passing PROVISIONING_PROFILE_SPECIFIER as a global CLI arg broke Pods targets;
          # this per-target approach avoids that.
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          awk -v prof="$PROFILE_UUID" '
            /97C147071CF9000F007C117D.*Release/ { in_block=1 }
            in_block && /buildSettings = \{/ {
              print
              print "\t\t\t\tCODE_SIGN_STYLE = Manual;"
              print "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"" prof "\";"
              in_block=0
              next
            }
            { print }
          ' "$PBXPROJ" > "${PBXPROJ}.patched"
          mv "${PBXPROJ}.patched" "$PBXPROJ"
          echo "Patched project.pbxproj with PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID"

          # Step C: Archive — CODE_SIGN_IDENTITY safe as global arg (doesn't break Pods)
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=N9P5D4TR73

          # Step D: Export signed IPA and upload to App Store Connect in one go.
          # uploadAndDistribute (ExportOptions.plist) + API key auth below replace
          # the old `xcrun altool --upload-app` step (altool was removed in Xcode 16).
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # ── 8. Clean up ─────────────────────────────────────────────
      - name: Clean up secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f ~/.appstoreconnect/private_keys/*.p8
